<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232f6fb8'/%3E%3Cpath d='M6 20h20v3H6z' fill='%23e8641c'/%3E%3Cpath d='M14 6h4l2 14h-8z' fill='%23f2f0ea'/%3E%3C/svg%3E">
<title>Gale Strip — Bush Pilot Landings</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1220; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Gale Strip, bush pilot landings: fly the Kestrel-9 onto four strips, from a calm grass field to a storm island, and land soft on the centreline"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module">
  import { startGame } from './src/main.js';
  startGame(document.getElementById('game'));
</script>
</body>
</html>
